<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kirim Lagu Untuk Zahira 🎵</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #dff6ff, #ffffff);
      color: #174a63;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 30px 18px;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header h1 {
      margin-bottom: 8px;
      font-size: 30px;
    }

    .header p {
      color: #52798a;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 8px 25px rgba(0, 100, 140, 0.12);
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 2px solid #c8e8f5;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      margin-bottom: 15px;
    }

    input:focus {
      border-color: #55bde5;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 13px 20px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .search-btn {
      width: 100%;
      background: #48b9e8;
      color: white;
    }

    .search-btn:hover {
      background: #2da7d8;
    }

    .song {
      display: flex;
      gap: 14px;
      align-items: center;
      padding: 12px;
      border: 1px solid #d9edf5;
      border-radius: 14px;
      margin-top: 12px;
    }

    .song img {
      width: 120px;
      height: 68px;
      object-fit: cover;
      border-radius: 8px;
    }

    .song-info {
      flex: 1;
    }

    .song-title {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .channel {
      font-size: 13px;
      color: #718d99;
      margin-bottom: 8px;
    }

    .select-btn {
      background: #e7f8ff;
      color: #1684b3;
      padding: 9px 13px;
      font-size: 14px;
    }

    .selected {
      background: #dff7e8;
      border: 2px solid #67c98a;
      padding: 15px;
      border-radius: 14px;
      margin-top: 15px;
      display: none;
    }

    .send-btn {
      width: 100%;
      margin-top: 15px;
      background: #55c878;
      color: white;
      display: none;
    }

    .send-btn:hover {
      background: #40b765;
    }

    .status {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
    }

    .loading {
      text-align: center;
      padding: 15px;
      color: #678c9b;
    }

    .received-song {
      border: 1px solid #d5ebf3;
      border-radius: 16px;
      overflow: hidden;
      margin-top: 15px;
      background: #fff;
    }

    .received-song iframe {
      width: 100%;
      height: 300px;
      border: 0;
    }

    .received-info {
      padding: 15px;
    }

    .received-info h3 {
      margin: 0 0 7px;
    }

    .sender {
      color: #64818c;
      font-size: 14px;
    }

    .empty {
      text-align: center;
      color: #78919b;
      padding: 15px;
    }

    @media (max-width: 500px) {
      .song {
        align-items: flex-start;
      }

      .song img {
        width: 100px;
        height: 58px;
      }

      .song {
        flex-wrap: wrap;
      }

      .select-btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>🐬🎵 Kirim Lagu Untuk Zahira</h1>
      <p>Pilih lagu yang ingin kamu kirim untuk Zahira 💙</p>
    </div>


    <!-- FORM KIRIM LAGU -->
    <div class="card">

      <label for="senderName">Nama kamu</label>

      <input
        type="text"
        id="senderName"
        placeholder="Tulis nama kamu..."
        maxlength="50"
      >

      <label for="searchInput">Cari lagu</label>

      <input
        type="text"
        id="searchInput"
        placeholder="Contoh: Perfect Ed Sheeran"
        onkeydown="if(event.key === 'Enter') searchSong()"
      >

      <button class="search-btn" onclick="searchSong()">
        🔎 Cari Lagu
      </button>

      <div id="searchResults"></div>

      <div id="selectedSong" class="selected">
        <b>🎵 Lagu yang dipilih:</b>
        <div id="selectedTitle"></div>
        <div id="selectedChannel"></div>

        <button
          id="sendButton"
          class="send-btn"
          onclick="sendSong()"
        >
          💌 Kirim Lagu
        </button>
      </div>

      <div id="status" class="status"></div>

    </div>


    <!-- LAGU YANG SUDAH DITERIMA -->
    <div class="card">

      <h2>💙 Lagu Untuk Zahira</h2>

      <p>
        Lagu-lagu yang sudah dikirim akan muncul di sini.
      </p>

      <div id="receivedSongs">
        <div class="loading">Memuat lagu...</div>
      </div>

    </div>

  </div>


  <!-- FIREBASE -->
  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

    import {
      getDatabase,
      ref,
      push,
    }
      from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


    // =====================================================
    // FIREBASE CONFIG
    // =====================================================
    // GANTI BAGIAN INI DENGAN firebaseConfig MILIK KAMU
    // =====================================================

    const firebaseConfig = {
    apiKey: "AIzaSyAKD0tqZ9LEeUKr3jvPGyM5WZvptCLeeAY",
    authDomain: "lagu-zahira.firebaseapp.com",
    databaseURL: "https://lagu-zahira-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "lagu-zahira",
    storageBucket: "lagu-zahira.firebasestorage.app",
    messagingSenderId: "987915034747",
    appId: "1:987915034747:web:f82f9b6a902aaba0cc02de"
    };


    const app = initializeApp(firebaseConfig);

    const database = getDatabase(app);

    const songsRef = ref(database, "songs");


    // =====================================================
    // YOUTUBE API
    // =====================================================

    const YOUTUBE_API_KEY = "AIzaSyDbb6OkDI-Wzi-k-XCIb1IQYHuWvw5PoKQ";


    let selectedSong = null;


    // =====================================================
    // CARI LAGU
    // =====================================================

    window.searchSong = async function() {

      const searchInput =
        document.getElementById("searchInput");

      const results =
        document.getElementById("searchResults");

      const query =
        searchInput.value.trim();


      if (!query) {

        results.innerHTML =
          "<div class='status'>Masukkan nama lagu dulu 🎵</div>";

        return;

      }


      results.innerHTML =
        "<div class='loading'>🔎 Sedang mencari lagu...</div>";


      try {

        const url =
          "https://www.googleapis.com/youtube/v3/search" +
          "?part=snippet" +
          "&maxResults=8" +
          "&type=video" +
          "&q=" + encodeURIComponent(query) +
          "&key=" + YOUTUBE_API_KEY;


        const response =
          await fetch(url);


        const data =
          await response.json();


        if (!response.ok) {

          console.error(data);

          results.innerHTML =
            "<div class='status'>❌ Gagal mencari lagu. Cek API YouTube.</div>";

          return;

        }


        if (!data.items || data.items.length === 0) {

          results.innerHTML =
            "<div class='empty'>Lagu tidak ditemukan 😢</div>";

          return;

        }


        results.innerHTML = "";


        data.items.forEach(item => {

          const videoId =
            item.id.videoId;

          const title =
            item.snippet.title;

          const channel =
            item.snippet.channelTitle;

          const thumbnail =
            item.snippet.thumbnails.medium.url;


          const div =
            document.createElement("div");

          div.className = "song";


          div.innerHTML = `

            <img
              src="${thumbnail}"
              alt="Thumbnail lagu"
            >

            <div class="song-info">

              <div class="song-title">
                ${escapeHtml(title)}
              </div>

              <div class="channel">
                ${escapeHtml(channel)}
              </div>

            </div>

            <button
              class="select-btn"
              onclick="selectSong(
                '${videoId}',
                ${JSON.stringify(title)},
                ${JSON.stringify(channel)}
              )"
            >
              Pilih
            </button>

          `;


          results.appendChild(div);

        });

      } catch (error) {

        console.error(error);

        results.innerHTML =
          "<div class='status'>❌ Terjadi kesalahan saat mencari lagu.</div>";

      }

    };


    // =====================================================
    // PILIH LAGU
    // =====================================================

    window.selectSong = function(
      videoId,
      title,
      channel
    ) {

      selectedSong = {

        videoId: videoId,

        title: title,

        channel: channel

      };


      document.getElementById("selectedTitle")
        .textContent = title;


      document.getElementById("selectedChannel")
        .textContent = "🎤 " + channel;


      document.getElementById("selectedSong")
        .style.display = "block";


      document.getElementById("sendButton")
        .style.display = "block";


      document.getElementById("status")
        .textContent = "✅ Lagu sudah dipilih!";

    };


    // =====================================================
    // KIRIM LAGU KE FIREBASE
    // =====================================================

    window.sendSong = async function() {

      const sender =
        document.getElementById("senderName")
          .value.trim();


      const status =
        document.getElementById("status");


      if (!sender) {

        status.textContent =
          "⚠️ Tulis nama kamu dulu.";

        return;

      }


      if (!selectedSong) {

        status.textContent =
          "⚠️ Pilih lagu dulu.";

        return;

      }


      status.textContent =
        "💌 Mengirim lagu...";


      try {

        await push(
          songsRef,
          {

            sender: sender,

            videoId: selectedSong.videoId,

            title: selectedSong.title,

            channel: selectedSong.channel,

            createdAt: Date.now()

          }
        );


        status.textContent =
          "💙 Lagu berhasil dikirim untuk Zahira!";


        document.getElementById("senderName")
          .value = "";


        document.getElementById("searchInput")
          .value = "";


        document.getElementById("searchResults")
          .innerHTML = "";


        document.getElementById("selectedSong")
          .style.display = "none";


        selectedSong = null;


      } catch (error) {

        console.error(error);

        status.textContent =
          "❌ Lagu gagal dikirim.";

      }

    };

    // =====================================================
    // KEAMANAN TAMPILAN TEKS
    // =====================================================

    function escapeHtml(text) {

      const div =
        document.createElement("div");

      div.textContent =
        text;

      return div.innerHTML;

    }

  </script>

</body>
</html>
