<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kirim Lagu Untuk Zahira 🎵</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background:
        linear-gradient(
          180deg,
          #dff6ff 0%,
          #f5fcff 50%,
          #ffffff 100%
        );
      color: #174a63;
      min-height: 100vh;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 30px 18px 50px;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header .dolphin {
      font-size: 55px;
      margin-bottom: 5px;
    }

    .header h1 {
      margin: 0 0 10px;
      font-size: 30px;
      color: #176b91;
    }

    .header p {
      margin: 0;
      color: #52798a;
      line-height: 1.5;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow:
        0 8px 25px rgba(0, 100, 140, 0.12);
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      color: #174a63;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 2px solid #c8e8f5;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      margin-bottom: 17px;
      color: #174a63;
      background: #fbfeff;
    }

    input:focus {
      border-color: #55bde5;
      background: white;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 13px 20px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .search-btn {
      width: 100%;
      background: #48b9e8;
      color: white;
    }

    .search-btn:hover {
      background: #2da7d8;
    }

    .song {
      display: flex;
      gap: 14px;
      align-items: center;
      padding: 12px;
      border: 1px solid #d9edf5;
      border-radius: 14px;
      margin-top: 12px;
      background: #fbfeff;
    }

    .song img {
      width: 120px;
      height: 68px;
      object-fit: cover;
      border-radius: 8px;
      flex-shrink: 0;
    }

    .song-info {
      flex: 1;
      min-width: 0;
    }

    .song-title {
      font-weight: bold;
      margin-bottom: 6px;
      line-height: 1.35;
      word-break: break-word;
      color: #174a63;
    }

    .channel {
      font-size: 13px;
      color: #718d99;
      line-height: 1.3;
      word-break: break-word;
    }

    .select-btn {
      background: #e7f8ff;
      color: #1684b3;
      padding: 9px 14px;
      font-size: 14px;
      flex-shrink: 0;
    }

    .select-btn:hover {
      background: #ccefff;
    }

    .selected {
      background: #e9fff0;
      border: 2px solid #67c98a;
      padding: 16px;
      border-radius: 14px;
      margin-top: 18px;
      display: none;
    }

    .selected-label {
      font-weight: bold;
      color: #26744a;
    }

    .selected-title {
      font-weight: bold;
      margin-top: 8px;
      line-height: 1.4;
      word-break: break-word;
      color: #174a63;
    }

    .selected-channel {
      color: #52798a;
      margin-top: 5px;
      word-break: break-word;
    }

    .send-btn {
      width: 100%;
      margin-top: 15px;
      background: #55c878;
      color: white;
    }

    .send-btn:hover {
      background: #40b765;
    }

    .status {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
      line-height: 1.5;
      min-height: 24px;
    }

    .loading {
      text-align: center;
      padding: 18px;
      color: #678c9b;
    }

    .empty {
      text-align: center;
      color: #78919b;
      padding: 18px;
    }

    .error {
      color: #d9534f;
    }

    .success {
      color: #249653;
    }

    .footer {
      text-align: center;
      color: #8aa8b4;
      font-size: 13px;
      margin-top: 20px;
    }

    @media (max-width: 500px) {

      .container {
        padding: 22px 14px 40px;
      }

      .header .dolphin {
        font-size: 45px;
      }

      .header h1 {
        font-size: 25px;
      }

      .song {
        align-items: flex-start;
        flex-wrap: wrap;
      }

      .song img {
        width: 100px;
        height: 58px;
      }

      .song-info {
        flex: 1;
        min-width: calc(100% - 120px);
      }

      .select-btn {
        width: 100%;
      }
    }
  </style>
</head>


<body>

  <div class="container">

    <!-- HEADER -->

    <div class="header">

      <div class="dolphin">
        🐬
      </div>

      <h1>
        🎵 Kirim Lagu Untuk Zahira
      </h1>

      <p>
        Pilih lagu yang ingin kamu kirim untuk Zahira 💙
      </p>

    </div>


    <!-- FORM -->

    <div class="card">

      <!-- NAMA -->

      <label for="senderName">
        👤 Nama kamu
      </label>

      <input
        type="text"
        id="senderName"
        placeholder="Tulis nama kamu..."
        maxlength="50"
        autocomplete="name"
      >


      <!-- SEARCH -->

      <label for="searchInput">
        🔎 Cari lagu
      </label>

      <input
        type="text"
        id="searchInput"
        placeholder="Contoh: Perfect Ed Sheeran"
        autocomplete="off"
      >


      <button
        id="searchButton"
        class="search-btn"
        type="button"
      >
        🔎 Cari Lagu
      </button>


      <!-- HASIL PENCARIAN -->

      <div id="searchResults"></div>


      <!-- LAGU TERPILIH -->

      <div
        id="selectedSong"
        class="selected"
      >

        <div class="selected-label">
          🎵 Lagu yang dipilih:
        </div>

        <div
          id="selectedTitle"
          class="selected-title"
        ></div>

        <div
          id="selectedChannel"
          class="selected-channel"
        ></div>


        <button
          id="sendButton"
          class="send-btn"
          type="button"
        >
          💌 Kirim Lagu
        </button>

      </div>


      <!-- STATUS -->

      <div
        id="status"
        class="status"
      ></div>

    </div>


    <div class="footer">
      🌊 Made with 💙 for Zahira 🐬
    </div>

  </div>


  <!-- ================================================== -->
  <!-- FIREBASE -->
  <!-- ================================================== -->

  <script type="module">

    // ==================================================
    // FIREBASE APP
    // ==================================================

    import {
      initializeApp
    }
    from
      "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


    // ==================================================
    // FIREBASE DATABASE
    // ==================================================

    import {
      getDatabase,
      ref,
      push
    }
    from
      "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


    // ==================================================
    // FIREBASE CONFIG
    // ==================================================

    const firebaseConfig = {

      apiKey:
        "AIzaSyAKD0tqZ9LEeUKr3jvPGyM5WZvptCLeeAY",

      authDomain:
        "lagu-zahira.firebaseapp.com",

      databaseURL:
        "https://lagu-zahira-default-rtdb.asia-southeast1.firebasedatabase.app",

      projectId:
        "lagu-zahira",

      storageBucket:
        "lagu-zahira.firebasestorage.app",

      messagingSenderId:
        "987915034747",

      appId:
        "1:987915034747:web:f82f9b6a902aaba0cc02de"

    };


    // ==================================================
    // START FIREBASE
    // ==================================================

    const app =
      initializeApp(firebaseConfig);


    const database =
      getDatabase(app);


    const songsRef =
      ref(database, "songs");


    // ==================================================
    // YOUTUBE API KEY
    // ==================================================

    /*
      MASUKKAN API KEY YOUTUBE MILIKMU DI SINI.

      Contoh:

      const YOUTUBE_API_KEY =
        "AIzaSyxxxxxxxxxxxxxxxx";

      Jangan kirim API key ke chat.
    */

    const YOUTUBE_API_KEY =
      "AIzaSyDbb6OkDI-Wzi-k-XCIb1IQYHuWvw5PoKQ";


    // ==================================================
    // FORMSPREE
    // ==================================================

    const FORMSPREE_URL =
      "https://formspree.io/f/xppzobkg";


    // ==================================================
    // VARIABEL
    // ==================================================

    let selectedSong = null;


    // ==================================================
    // ELEMENT HALAMAN
    // ==================================================

    const senderNameInput =
      document.getElementById(
        "senderName"
      );


    const searchInput =
      document.getElementById(
        "searchInput"
      );


    const searchButton =
      document.getElementById(
        "searchButton"
      );


    const searchResults =
      document.getElementById(
        "searchResults"
      );


    const selectedSongBox =
      document.getElementById(
        "selectedSong"
      );


    const selectedTitle =
      document.getElementById(
        "selectedTitle"
      );


    const selectedChannel =
      document.getElementById(
        "selectedChannel"
      );


    const sendButton =
      document.getElementById(
        "sendButton"
      );


    const status =
      document.getElementById(
        "status"
      );


    // ==================================================
    // TOMBOL CARI
    // ==================================================

    searchButton.addEventListener(
      "click",
      searchSong
    );


    // ==================================================
    // ENTER = CARI
    // ==================================================

    searchInput.addEventListener(
      "keydown",
      function (event) {

        if (event.key === "Enter") {

          event.preventDefault();

          searchSong();

        }

      }
    );


    // ==================================================
    // FUNGSI CARI LAGU
    // ==================================================

    async function searchSong() {

      const query =
        searchInput.value.trim();


      // -----------------------------------------------
      // CEK API KEY
      // -----------------------------------------------

      if (
        !YOUTUBE_API_KEY ||
        YOUTUBE_API_KEY ===
          "MASUKKAN_API_KEY_YOUTUBE_DI_SINI"
      ) {

        status.textContent =
          "⚠️ API YouTube belum dimasukkan.";

        status.className =
          "status error";

        return;

      }


      // -----------------------------------------------
      // CEK PENCARIAN
      // -----------------------------------------------

      if (!query) {

        status.textContent =
          "⚠️ Masukkan nama lagu dulu 🎵";

        status.className =
          "status";

        searchInput.focus();

        return;

      }


      // -----------------------------------------------
      // RESET
      // -----------------------------------------------

      searchResults.innerHTML =
        `
        <div class="loading">
          🔎 Sedang mencari lagu...
        </div>
        `;


      status.textContent = "";

      status.className =
        "status";


      searchButton.disabled = true;


      try {

        // ---------------------------------------------
        // URL YOUTUBE API
        // ---------------------------------------------

        const url =
          "https://www.googleapis.com/youtube/v3/search" +

          "?part=snippet" +

          "&maxResults=8" +

          "&type=video" +

          "&q=" +
          encodeURIComponent(query) +

          "&key=" +
          encodeURIComponent(
            YOUTUBE_API_KEY
          );


        // ---------------------------------------------
        // REQUEST
        // ---------------------------------------------

        const response =
          await fetch(url);


        const data =
          await response.json();


        // ---------------------------------------------
        // ERROR
        // ---------------------------------------------

        if (!response.ok) {

          console.error(
            "YouTube API:",
            data
          );


          searchResults.innerHTML =
            `
            <div class="status error">
              ❌ Gagal mencari lagu.
              <br>
              Cek API YouTube kamu.
            </div>
            `;

          return;

        }


        // ---------------------------------------------
        // TIDAK ADA HASIL
        // ---------------------------------------------

        if (
          !data.items ||
          data.items.length === 0
        ) {

          searchResults.innerHTML =
            `
            <div class="empty">
              Lagu tidak ditemukan 😢
            </div>
            `;

          return;

        }


        // ---------------------------------------------
        // BERSIHKAN HASIL
        // ---------------------------------------------

        searchResults.innerHTML = "";


        // ---------------------------------------------
        // TAMPILKAN HASIL
        // ---------------------------------------------

        data.items.forEach(
          function (item) {

            // =========================================
            // DATA VIDEO
            // =========================================

            const videoId =
              item.id.videoId;


            const title =
              item.snippet.title;


            const channel =
              item.snippet.channelTitle;


            let thumbnail = "";


            if (
              item.snippet.thumbnails &&
              item.snippet.thumbnails.medium
            ) {

              thumbnail =
                item.snippet.thumbnails.medium.url;

            }

            else if (
              item.snippet.thumbnails &&
              item.snippet.thumbnails.default
            ) {

              thumbnail =
                item.snippet.thumbnails.default.url;

            }


            // =========================================
            // CONTAINER
            // =========================================

            const div =
              document.createElement(
                "div"
              );


            div.className =
              "song";


            // =========================================
            // THUMBNAIL
            // =========================================

            const image =
              document.createElement(
                "img"
              );


            image.src =
              thumbnail;


            image.alt =
              "Thumbnail lagu";


            // =========================================
            // INFO
            // =========================================

            const info =
              document.createElement(
                "div"
              );


            info.className =
              "song-info";


            const titleElement =
              document.createElement(
                "div"
              );


            titleElement.className =
              "song-title";


            titleElement.textContent =
              title;


            const channelElement =
              document.createElement(
                "div"
              );


            channelElement.className =
              "channel";


            channelElement.textContent =
              channel;


            info.appendChild(
              titleElement
            );


            info.appendChild(
              channelElement
            );


            // =========================================
            // TOMBOL PILIH
            // =========================================

            const selectButton =
              document.createElement(
                "button"
              );


            selectButton.type =
              "button";


            selectButton.className =
              "select-btn";


            selectButton.textContent =
              "Pilih";


            // =========================================
            // EVENT KLIK
            // =========================================

            selectButton.addEventListener(
              "click",
              function () {

                selectSong(
                  videoId,
                  title,
                  channel
                );

              }
            );


            // =========================================
            // GABUNGKAN
            // =========================================

            div.appendChild(
              image
            );


            div.appendChild(
              info
            );


            div.appendChild(
              selectButton
            );


            searchResults.appendChild(
              div
            );

          }
        );

      }

      catch (error) {

        console.error(
          "Search error:",
          error
        );


        searchResults.innerHTML =
          `
          <div class="status error">
            ❌ Terjadi kesalahan saat mencari lagu.
          </div>
          `;

      }

      finally {

        searchButton.disabled =
          false;

      }

    }


    // ==================================================
    // PILIH LAGU
    // ==================================================

    function selectSong(
      videoId,
      title,
      channel
    ) {

      // -----------------------------------------------
      // SIMPAN DATA
      // -----------------------------------------------

      selectedSong = {

        videoId:
          videoId,

        title:
          title,

        channel:
          channel

      };


      // -----------------------------------------------
      // TAMPILKAN
      // -----------------------------------------------

      selectedTitle.textContent =
        title;


      selectedChannel.textContent =
        "🎤 " + channel;


      selectedSongBox.style.display =
        "block";


      sendButton.style.display =
        "block";


      status.textContent =
        "✅ Lagu sudah dipilih!";


      status.className =
        "status success";


      // -----------------------------------------------
      // SCROLL
      // -----------------------------------------------

      selectedSongBox.scrollIntoView({
        behavior: "smooth",
        block: "center"
      });

    }


    // ==================================================
    // TOMBOL KIRIM
    // ==================================================

    sendButton.addEventListener(
      "click",
      sendSong
    );


    // ==================================================
    // KIRIM LAGU
    // ==================================================

    async function sendSong() {

      // -----------------------------------------------
      // NAMA
      // -----------------------------------------------

      const sender =
        senderNameInput.value.trim();


      // -----------------------------------------------
      // CEK NAMA
      // -----------------------------------------------

      if (!sender) {

        status.textContent =
          "⚠️ Tulis nama kamu dulu.";

        status.className =
          "status error";

        senderNameInput.focus();

        return;

      }


      // -----------------------------------------------
      // CEK LAGU
      // -----------------------------------------------

      if (!selectedSong) {

        status.textContent =
          "⚠️ Pilih lagu dulu.";

        status.className =
          "status error";

        return;

      }


      // -----------------------------------------------
      // DISABLE
      // -----------------------------------------------

      sendButton.disabled =
        true;


      searchButton.disabled =
        true;


      status.textContent =
        "💌 Sedang mengirim lagu...";


      status.className =
        "status";


      try {

        // =============================================
        // 1. SIMPAN KE FIREBASE
        // =============================================

        await push(
          songsRef,
          {

            sender:
              sender,

            videoId:
              selectedSong.videoId,

            title:
              selectedSong.title,

            channel:
              selectedSong.channel,

            createdAt:
              Date.now()

          }
        );


        // =============================================
        // 2. KIRIM EMAIL FORMSPREE
        // =============================================

        const formData =
          new FormData();


        formData.append(
          "sender",
          sender
        );


        formData.append(
          "song_title",
          selectedSong.title
        );


        formData.append(
          "artist_channel",
          selectedSong.channel
        );


        formData.append(
          "youtube_video_id",
          selectedSong.videoId
        );


        formData.append(
          "youtube_link",
          "https://www.youtube.com/watch?v=" +
          selectedSong.videoId
        );


        formData.append(
          "subject",
          "🎵 Ada lagu baru untuk Zahira!"
        );


        // =============================================
        // REQUEST FORMSPREE
        // =============================================

        const emailResponse =
          await fetch(
            FORMSPREE_URL,
            {

              method:
                "POST",

              body:
                formData,

              headers:
                {
                  "Accept":
                    "application/json"
                }

            }
          );


        // =============================================
        // CEK FORMSPREE
        // =============================================

        if (!emailResponse.ok) {

          const errorText =
            await emailResponse.text();


          console.error(
            "Formspree error:",
            errorText
          );


          /*
            Firebase sudah berhasil menyimpan lagu,
            tetapi email gagal dikirim.
          */

          status.textContent =
            "💙 Lagu tersimpan, tetapi email gagal dikirim.";

          status.className =
            "status error";

          return;

        }


        // =============================================
        // BERHASIL SEMUANYA
        // =============================================

        status.textContent =
          "💙 Lagu berhasil dikirim untuk Zahira!";


        status.className =
          "status success";


        // =============================================
        // RESET NAMA
        // =============================================

        senderNameInput.value =
          "";


        // =============================================
        // RESET PENCARIAN
        // =============================================

        searchInput.value =
          "";


        searchResults.innerHTML =
          "";


        // =============================================
        // RESET LAGU
        // =============================================

        selectedTitle.textContent =
          "";


        selectedChannel.textContent =
          "";


        selectedSongBox.style.display =
          "none";


        selectedSong =
          null;

      }

      catch (error) {

        console.error(
          "Send error:",
          error
        );


        status.textContent =
          "❌ Lagu gagal dikirim. Coba lagi.";


        status.className =
          "status error";

      }

      finally {

        sendButton.disabled =
          false;


        searchButton.disabled =
          false;

      }

    }

  </script>

</body>

</html>
