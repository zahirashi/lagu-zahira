<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>🎵 Lagu Untuk Zahira 🐬</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(
        rgba(70, 190, 235, 0.7),
        rgba(5, 100, 170, 0.85)
      );
      padding: 25px 15px;
    }

    .container {
      width: 100%;
      max-width: 650px;
      margin: auto;
      background: rgba(255, 255, 255, 0.96);
      padding: 30px;
      border-radius: 28px;
      box-shadow: 0 15px 40px rgba(0, 70, 120, 0.3);
    }

    .ocean {
      text-align: center;
      font-size: 45px;
      margin-bottom: 10px;
    }

    h1 {
      text-align: center;
      color: #0879b9;
      margin: 5px 0 10px;
    }

    .description {
      text-align: center;
      color: #527080;
      line-height: 1.6;
    }

    .search-box {
      margin-top: 25px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 2px solid #b5e5f7;
      border-radius: 15px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #149bd7;
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 15px;
      border: none;
      border-radius: 15px;
      background: #149bd7;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #0879b9;
    }

    #status {
      text-align: center;
      margin-top: 15px;
      color: #0879b9;
    }

    .results {
      margin-top: 25px;
    }

    .song {
      background: #eaf8ff;
      border-radius: 18px;
      padding: 12px;
      margin-bottom: 15px;
    }

    .song img {
      width: 100%;
      border-radius: 12px;
      display: block;
    }

    .song-title {
      font-weight: bold;
      color: #0879b9;
      margin-top: 10px;
      line-height: 1.4;
    }

    .song-channel {
      color: #527080;
      font-size: 14px;
      margin-top: 5px;
    }

    .play-button {
      margin-top: 10px;
      background: #0879b9;
    }

    .player {
      margin-top: 25px;
      display: none;
    }

    .player iframe {
      width: 100%;
      height: 315px;
      border: none;
      border-radius: 18px;
    }

    .bottom-ocean {
      text-align: center;
      margin-top: 25px;
      font-size: 25px;
      letter-spacing: 4px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="ocean">
      🐬🌊🫧
    </div>

    <h1>🎵 Lagu Untuk Zahira 🐬</h1>

    <p class="description">
      Cari lagu apa saja yang ingin kamu dengarkan. 💙
      <br>
      Hasil pencarian akan muncul di sini. 🎶🌊
    </p>

    <div class="search-box">

      <input
        type="text"
        id="search"
        placeholder="🔎 Ketik judul lagu atau penyanyi..."
      >

      <button onclick="searchSong()">
        🐬 Cari Lagu 🌊
      </button>

    </div>

    <div id="status"></div>

    <div id="player" class="player">
      <iframe
        id="youtubePlayer"
        allow="autoplay; encrypted-media"
        allowfullscreen>
      </iframe>
    </div>

    <div id="results" class="results"></div>

    <div class="bottom-ocean">
      🐚 🐟 🫧 🌊 🐬 💙
    </div>

  </div>


  <script>

    // ==========================================
    // MASUKKAN API KEY KAMU DI DALAM TANDA KUTIP
    // ==========================================

    const API_KEY = "AIzaSyDbb6OkDI-Wzi-k-XCIb1IQYHuWvw5PoKQ";


    async function searchSong() {

      const searchInput =
        document.getElementById("search");

      const results =
        document.getElementById("results");

      const status =
        document.getElementById("status");

      const query =
        searchInput.value.trim();


      if (query === "") {

        alert("🐬 Tulis nama lagu dulu ya! 🌊");

        return;
      }


      status.textContent =
        "🫧 Sedang mencari lagu... 🐬🌊";

      results.innerHTML = "";


      try {

        const url =
          "https://www.googleapis.com/youtube/v3/search"
          + "?part=snippet"
          + "&maxResults=10"
          + "&type=video"
          + "&q=" + encodeURIComponent(query)
          + "&key=" + API_KEY;


        const response =
          await fetch(url);


        const data =
          await response.json();


        if (!response.ok) {

          throw new Error(
            data.error?.message ||
            "Gagal mencari lagu"
          );

        }


        status.textContent =
          "🎵 Hasil pencarian:";


        if (!data.items || data.items.length === 0) {

          results.innerHTML =
            "<p style='text-align:center;'>"
            + "😢 Lagu tidak ditemukan."
            + "</p>";

          return;
        }


        data.items.forEach(function(item) {

          const videoId =
            item.id.videoId;

          const title =
            item.snippet.title;

          const channel =
            item.snippet.channelTitle;

          const thumbnail =
            item.snippet.thumbnails.high.url;


          const song =
            document.createElement("div");

          song.className = "song";


          song.innerHTML = `

            <img
              src="${thumbnail}"
              alt="${title}"
            >

            <div class="song-title">
              ${title}
            </div>

            <div class="song-channel">
              🎤 ${channel}
            </div>

            <button
              class="play-button"
              onclick="playSong('${videoId}')">

              ▶️ Putar Lagu

            </button>

          `;


          results.appendChild(song);

        });


      } catch (error) {

        console.error(error);

        status.textContent =
          "❌ Terjadi kesalahan.";

        results.innerHTML = `

          <p style="
            text-align:center;
            color:#d33;
          ">
            Tidak bisa mencari lagu.
            <br>
            Periksa API key dan koneksi internet.
          </p>

        `;

      }

    }


    function playSong(videoId) {

      const player =
        document.getElementById("player");

      const youtubePlayer =
        document.getElementById("youtubePlayer");


      youtubePlayer.src =
        "https://www.youtube.com/embed/"
        + videoId
        + "?autoplay=1";


      player.style.display =
        "block";


      window.scrollTo({

        top: player.offsetTop - 20,

        behavior: "smooth"

      });

    }


    document
      .getElementById("search")
      .addEventListener("keypress", function(event) {

        if (event.key === "Enter") {

          searchSong();

        }

      });

  </script>

</body>
</html>
