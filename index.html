<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kirim Lagu Untuk Zahira 🎵</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #dff6ff, #ffffff);
      color: #174a63;
      min-height: 100vh;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 30px 18px;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header h1 {
      margin-bottom: 8px;
      font-size: 30px;
    }

    .header p {
      color: #52798a;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 8px 25px rgba(0, 100, 140, 0.12);
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 2px solid #c8e8f5;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      margin-bottom: 15px;
    }

    input:focus {
      border-color: #55bde5;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 13px 20px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .search-btn {
      width: 100%;
      background: #48b9e8;
      color: white;
    }

    .search-btn:hover {
      background: #2da7d8;
    }

    .song {
      display: flex;
      gap: 14px;
      align-items: center;
      padding: 12px;
      border: 1px solid #d9edf5;
      border-radius: 14px;
      margin-top: 12px;
    }

    .song img {
      width: 120px;
      height: 68px;
      object-fit: cover;
      border-radius: 8px;
      flex-shrink: 0;
    }

    .song-info {
      flex: 1;
      min-width: 0;
    }

    .song-title {
      font-weight: bold;
      margin-bottom: 5px;
      line-height: 1.3;
      word-break: break-word;
    }

    .channel {
      font-size: 13px;
      color: #718d99;
      margin-bottom: 8px;
    }

    .select-btn {
      background: #e7f8ff;
      color: #1684b3;
      padding: 9px 13px;
      font-size: 14px;
      flex-shrink: 0;
    }

    .select-btn:hover {
      background: #ccefff;
    }

    .selected {
      background: #dff7e8;
      border: 2px solid #67c98a;
      padding: 15px;
      border-radius: 14px;
      margin-top: 15px;
      display: none;
    }

    .selected-title {
      font-weight: bold;
      margin-top: 8px;
      word-break: break-word;
    }

    .selected-channel {
      color: #52798a;
      margin-top: 5px;
      word-break: break-word;
    }

    .send-btn {
      width: 100%;
      margin-top: 15px;
      background: #55c878;
      color: white;
    }

    .send-btn:hover {
      background: #40b765;
    }

    .status {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
      line-height: 1.5;
    }

    .loading {
      text-align: center;
      padding: 15px;
      color: #678c9b;
    }

    .empty {
      text-align: center;
      color: #78919b;
      padding: 15px;
    }

    .error {
      color: #d9534f;
    }

    @media (max-width: 500px) {
      .container {
        padding: 22px 14px;
      }

      .header h1 {
        font-size: 25px;
      }

      .song {
        align-items: flex-start;
        flex-wrap: wrap;
      }

      .song img {
        width: 100px;
        height: 58px;
      }

      .song-info {
        flex: 1;
        min-width: calc(100% - 120px);
      }

      .select-btn {
        width: 100%;
      }
    }
  </style>
</head>


<body>

  <div class="container">

    <!-- HEADER -->
    <div class="header">

      <h1>🐬🎵 Kirim Lagu Untuk Zahira</h1>

      <p>
        Pilih lagu yang ingin kamu kirim untuk Zahira 💙
      </p>

    </div>


    <!-- FORM KIRIM LAGU -->
    <div class="card">

      <!-- NAMA -->
      <label for="senderName">
        Nama kamu
      </label>

      <input
        type="text"
        id="senderName"
        placeholder="Tulis nama kamu..."
        maxlength="50"
        autocomplete="name"
      >


      <!-- CARI LAGU -->
      <label for="searchInput">
        Cari lagu
      </label>

      <input
        type="text"
        id="searchInput"
        placeholder="Contoh: Perfect Ed Sheeran"
        autocomplete="off"
      >


      <button
        id="searchButton"
        class="search-btn"
        type="button"
      >
        🔎 Cari Lagu
      </button>


      <!-- HASIL PENCARIAN -->
      <div id="searchResults"></div>


      <!-- LAGU YANG DIPILIH -->
      <div
        id="selectedSong"
        class="selected"
      >

        <b>🎵 Lagu yang dipilih:</b>

        <div
          id="selectedTitle"
          class="selected-title"
        ></div>

        <div
          id="selectedChannel"
          class="selected-channel"
        ></div>


        <button
          id="sendButton"
          class="send-btn"
          type="button"
        >
          💌 Kirim Lagu
        </button>

      </div>


      <!-- STATUS -->
      <div
        id="status"
        class="status"
      ></div>

    </div>

  </div>


  <!-- FIREBASE -->
  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


    import {
      getDatabase,
      ref,
      push
    }
      from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


    // =====================================================
    // FIREBASE CONFIG
    // =====================================================

    const firebaseConfig = {

      apiKey: "AIzaSyAKD0tqZ9LEeUKr3jvPGyM5WZvptCLeeAY",

      authDomain: "lagu-zahira.firebaseapp.com",

      databaseURL:
        "https://lagu-zahira-default-rtdb.asia-southeast1.firebasedatabase.app",

      projectId: "lagu-zahira",

      storageBucket:
        "lagu-zahira.firebasestorage.app",

      messagingSenderId:
        "987915034747",

      appId:
        "1:987915034747:web:f82f9b6a902aaba0cc02de"

    };


    // =====================================================
    // HUBUNGKAN FIREBASE
    // =====================================================

    const app =
      initializeApp(firebaseConfig);


    const database =
      getDatabase(app);


    const songsRef =
      ref(database, "songs");


    // =====================================================
    // YOUTUBE API
    // =====================================================

    // MASUKKAN API KEY YOUTUBE MILIKMU DI SINI
    //
    // Contoh:
    // const YOUTUBE_API_KEY = "AIza....";
    //
    // Jangan kirim API key tersebut ke chat.

    const YOUTUBE_API_KEY = "AIzaSyDbb6OkDI-Wzi-k-XCIb1IQYHuWvw5PoKQ";


    // =====================================================
    // VARIABEL
    // =====================================================

    let selectedSong = null;


    // =====================================================
    // ELEMENT
    // =====================================================

    const senderNameInput =
      document.getElementById("senderName");


    const searchInput =
      document.getElementById("searchInput");


    const searchButton =
      document.getElementById("searchButton");


    const searchResults =
      document.getElementById("searchResults");


    const selectedSongBox =
      document.getElementById("selectedSong");


    const selectedTitle =
      document.getElementById("selectedTitle");


    const selectedChannel =
      document.getElementById("selectedChannel");


    const sendButton =
      document.getElementById("sendButton");


    const status =
      document.getElementById("status");


    // =====================================================
    // TOMBOL CARI
    // =====================================================

    searchButton.addEventListener(
      "click",
      searchSong
    );


    // =====================================================
    // ENTER UNTUK MENCARI
    // =====================================================

    searchInput.addEventListener(
      "keydown",
      function (event) {

        if (event.key === "Enter") {

          event.preventDefault();

          searchSong();

        }

      }
    );


    // =====================================================
    // FUNGSI CARI LAGU
    // =====================================================

    async function searchSong() {

      const query =
        searchInput.value.trim();


      // CEK API KEY
      if (!YOUTUBE_API_KEY) {

        status.textContent =
          "⚠️ API YouTube belum dimasukkan.";

        status.className =
          "status error";

        return;

      }


      // CEK INPUT
      if (!query) {

        status.textContent =
          "⚠️ Masukkan nama lagu dulu 🎵";

        status.className =
          "status";

        return;

      }


      // RESET
      searchResults.innerHTML =
        '<div class="loading">🔎 Sedang mencari lagu...</div>';


      status.textContent = "";


      searchButton.disabled = true;


      try {

        // =================================================
        // URL YOUTUBE API
        // =================================================

        const url =
          "https://www.googleapis.com/youtube/v3/search" +

          "?part=snippet" +

          "&maxResults=8" +

          "&type=video" +

          "&q=" +
          encodeURIComponent(query) +

          "&key=" +
          YOUTUBE_API_KEY;


        // =================================================
        // REQUEST
        // =================================================

        const response =
          await fetch(url);


        const data =
          await response.json();


        // =================================================
        // CEK RESPONSE
        // =================================================

        if (!response.ok) {

          console.error(
            "YouTube API error:",
            data
          );


          searchResults.innerHTML =
            '<div class="status error">' +
            "❌ Gagal mencari lagu. Cek API YouTube." +
            "</div>";


          return;

        }


        // =================================================
        // CEK HASIL
        // =================================================

        if (
          !data.items ||
          data.items.length === 0
        ) {

          searchResults.innerHTML =
            '<div class="empty">' +
            "Lagu tidak ditemukan 😢" +
            "</div>";


          return;

        }


        // =================================================
        // KOSONGKAN HASIL LAMA
        // =================================================

        searchResults.innerHTML = "";


        // =================================================
        // TAMPILKAN HASIL
        // =================================================

        data.items.forEach(
          function (item) {

            const videoId =
              item.id.videoId;


            const title =
              item.snippet.title;


            const channel =
              item.snippet.channelTitle;


            const thumbnail =
              item.snippet.thumbnails.medium.url;


            // ---------------------------------------------
            // BUAT CONTAINER
            // ---------------------------------------------

            const div =
              document.createElement("div");


            div.className =
              "song";


            // ---------------------------------------------
            // HTML
            // ---------------------------------------------

            div.innerHTML = `

              <img
                src="${escapeHtml(thumbnail)}"
                alt="Thumbnail lagu"
              >

              <div class="song-info">

                <div class="song-title">
                  ${escapeHtml(title)}
                </div>

                <div class="channel">
                  ${escapeHtml(channel)}
                </div>

              </div>

              <button
                class="select-btn"
                type="button"
              >
                Pilih
              </button>

            `;


            // ---------------------------------------------
            // AMBIL TOMBOL
            // ---------------------------------------------

            const selectButton =
              div.querySelector(".select-btn");


            // ---------------------------------------------
            // EVENT KLIK
            // ---------------------------------------------

            selectButton.addEventListener(
              "click",
              function () {

                selectSong(
                  videoId,
                  title,
                  channel
                );

              }
            );


            // ---------------------------------------------
            // MASUKKAN KE HALAMAN
            // ---------------------------------------------

            searchResults.appendChild(div);

          }
        );

      }

      catch (error) {

        console.error(error);


        searchResults.innerHTML =
          '<div class="status error">' +
          "❌ Terjadi kesalahan saat mencari lagu." +
          "</div>";

      }

      finally {

        searchButton.disabled = false;

      }

    }


    // =====================================================
    // PILIH LAGU
    // =====================================================

    function selectSong(
      videoId,
      title,
      channel
    ) {

      selectedSong = {

        videoId: videoId,

        title: title,

        channel: channel

      };


      // TAMPILKAN JUDUL
      selectedTitle.textContent =
        title;


      // TAMPILKAN CHANNEL
      selectedChannel.textContent =
        "🎤 " + channel;


      // TAMPILKAN BOX
      selectedSongBox.style.display =
        "block";


      // TAMPILKAN TOMBOL KIRIM
      sendButton.style.display =
        "block";


      // STATUS
      status.textContent =
        "✅ Lagu sudah dipilih!";


      status.className =
        "status";


      // SCROLL KE LAGU TERPILIH
      selectedSongBox.scrollIntoView({
        behavior: "smooth",
        block: "center"
      });

    }


    // =====================================================
    // TOMBOL KIRIM
    // =====================================================

    sendButton.addEventListener(
      "click",
      sendSong
    );


    // =====================================================
    // KIRIM LAGU KE FIREBASE
    // =====================================================

    async function sendSong() {

      const sender =
        senderNameInput.value.trim();


      // =================================================
      // CEK NAMA
      // =================================================

      if (!sender) {

        status.textContent =
          "⚠️ Tulis nama kamu dulu.";

        status.className =
          "status";

        senderNameInput.focus();

        return;

      }


      // =================================================
      // CEK LAGU
      // =================================================

      if (!selectedSong) {

        status.textContent =
          "⚠️ Pilih lagu dulu.";

        status.className =
          "status";

        return;

      }


      // =================================================
      // DISABLE TOMBOL
      // =================================================

      sendButton.disabled = true;


      status.textContent =
        "💌 Mengirim lagu...";

      status.className =
        "status";


      try {

        // =================================================
        // SIMPAN KE FIREBASE
        // =================================================

        await push(
          songsRef,
          {

            sender: sender,

            videoId:
              selectedSong.videoId,

            title:
              selectedSong.title,

            channel:
              selectedSong.channel,

            createdAt:
              Date.now()

          }
        );


        // =================================================
        // BERHASIL
        // =================================================

        status.textContent =
          "💙 Lagu berhasil dikirim untuk Zahira!";


        status.className =
          "status";


        // =================================================
        // RESET FORM
        // =================================================

        senderNameInput.value =
          "";


        searchInput.value =
          "";


        searchResults.innerHTML =
          "";


        selectedSongBox.style.display =
          "none";


        selectedTitle.textContent =
          "";


        selectedChannel.textContent =
          "";


        selectedSong =
          null;

      }

      catch (error) {

        console.error(
          "Firebase error:",
          error
        );


        status.textContent =
          "❌ Lagu gagal dikirim. Coba lagi.";


        status.className =
          "status error";

      }

      finally {

        sendButton.disabled =
          false;

      }

    }


    // =====================================================
    // KEAMANANAN TAMPILAN TEKS
    // =====================================================

    function escapeHtml(text) {

      const div =
        document.createElement("div");


      div.textContent =
        text;


      return div.innerHTML;

    }

  </script>

</body>

</html>
